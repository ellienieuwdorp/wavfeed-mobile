// The website APK's install permission (task 0065, decision 6). EAS's `apk` profile sets WAVFEED_DISTRIBUTION=apk for
// the build, and only then does this library's manifest, merged into the app's, ask for REQUEST_INSTALL_PACKAGES. The
// files are the same for every build, so the APK and the Play build share one runtime fingerprint, and the module is
// Android only, so iOS's fingerprint never sees it.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.wavfeed'
version = '1.0.0'

android {
  namespace 'com.wavfeed.apkinstallpermission'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  sourceSets {
    main {
      manifest.srcFile(System.getenv('WAVFEED_DISTRIBUTION') == 'apk' ? 'src/apk/AndroidManifest.xml' : 'src/main/AndroidManifest.xml')
    }
  }
}
